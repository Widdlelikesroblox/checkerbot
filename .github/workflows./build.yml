name: Build apps
# Builds a standalone app, with the C engine inside, for Windows, macOS and Linux.
# Run it from the Actions tab, or push a tag such as v1.0.0 to also publish a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, lib: kingmaker.dll, sep: ";" }
          - { os: macos-latest, lib: libkingmaker.dylib, sep: ":" }
          - { os: ubuntu-latest, lib: libkingmaker.so, sep: ":" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the C engine
        run: python build_native.py
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build the app
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --windowed --name "Kingmaker-${{ runner.os }}" \
            --add-binary "kingmaker/${{ matrix.lib }}${{ matrix.sep }}kingmaker" run.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kingmaker-${{ runner.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
